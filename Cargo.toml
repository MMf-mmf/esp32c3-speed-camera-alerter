[package]
edition      = "2021"
name         = "gps"
rust-version = "1.86"
version      = "0.1.0"

[[bin]]
name = "gps"
path = "./src/bin/main.rs"

[dependencies]
defmt = "1.0.1"
esp-bootloader-esp-idf = { version = "0.2.0", features = ["esp32c3"] }
esp-hal = { version = "=1.0.0-rc.0", features = [
  "defmt",
  "esp32c3",
  "unstable",
] }
nb = "1.1.0"
critical-section = "1.2.0"
esp-println      = { version = "0.15.0", features = ["defmt-espflash", "esp32c3"] }
heapless = "0.9.1"
ssd1306 = { git = "https://github.com/rust-embedded-community/ssd1306.git", rev = "f3a2f7aca421fbf3ddda45ecef0dfd1f0f12330e", features = [
    "async",
] }
embedded-graphics = "0.8.1"
libm = "0.2.8"
# Embassy dependencies
embassy-executor = { version = "0.7.0", features = ["task-arena-size-20480"] }
embassy-time     = "0.4.0"
embassy-sync     = "0.6.0"
esp-hal-embassy  = { version = "0.9.0", features = ["esp32c3"] }
static_cell      = "2.1.1"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
